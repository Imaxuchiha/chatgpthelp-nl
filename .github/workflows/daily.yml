name: redactie

# Volledig autonome redactie: 2x per dag nieuws schrijven (ochtend + middag), 1x per dag meme +
# prompt van de dag, woensdag een uitleg-artikel, zondag het weekoverzicht. Daarna site bouwen en
# naar GitHub Pages publiceren. Nodig als secret: DEEPSEEK_API_KEY. Optioneel: SLACK_WEBHOOK_URL,
# BSKY_HANDLE + BSKY_APP_PASSWORD.
on:
  schedule:
    - cron: '20 5 * * *'   # 07:20 NL (zomer) — ochtendeditie + meme + prompt
    - cron: '40 11 * * *'  # 13:40 NL — middageditie
    - cron: '10 16 * * *'  # 18:10 NL — avondeditie
  workflow_dispatch:
    inputs:
      what:
        description: 'run (standaard) | build | status | seo'
        default: 'run'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: redactie
  cancel-in-progress: false

jobs:
  redactie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redactie draaien
        run: python -m engine.run ${{ github.event.inputs.what || 'run' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          TZ: Europe/Amsterdam

      - name: Content vastleggen
        run: |
          git config user.name "chatgpthelp-redactie"
          git config user.email "redactie@chatgpthelp.nl"
          git add content
          if git diff --cached --quiet; then
            echo "geen nieuwe content"
          else
            git commit -m "redactie: $(date +%F\ %H:%M)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Site bouwen
        run: python -m engine.run build
        env:
          TZ: Europe/Amsterdam

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: redactie
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
