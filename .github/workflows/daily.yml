name: redactie

# Volledig autonome redactie: 3x per dag nieuws; de planner in engine/run.py (STEPS) doet in de eerste run
# van de dag meme + prompt + de weekstappen. Niets hangt af van het klokuur: GitHub start geplande runs
# vaak 3-5 uur te laat. Daarna site bouwen en
# naar GitHub Pages publiceren. Nodig als secret: DEEPSEEK_API_KEY. Optioneel: SLACK_WEBHOOK_URL,
# BSKY_HANDLE + BSKY_APP_PASSWORD.
on:
  schedule:
    - cron: '20 3 * * *'   # 05:20 NL (zomer) — vroeg gepland zodat de vertraagde start toch 's ochtends valt
    - cron: '40 11 * * *'  # 13:40 NL — middageditie
    - cron: '10 16 * * *'  # 18:10 NL — avondeditie
  workflow_dispatch:
    inputs:
      what:
        description: 'run (standaard) | build | status | seo'
        default: 'run'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: redactie
  cancel-in-progress: false

jobs:
  redactie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redactie draaien
        run: python -m engine.run ${{ github.event.inputs.what || 'run' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          TZ: Europe/Amsterdam

      - name: Content vastleggen
        run: |
          git config user.name "chatgpthelp-redactie"
          git config user.email "redactie@chatgpthelp.nl"
          git add content
          if git diff --cached --quiet; then
            echo "geen nieuwe content"
          else
            git commit -m "redactie: $(date +%F\ %H:%M)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Site bouwen
        run: python -m engine.run build
        env:
          TZ: Europe/Amsterdam

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: redactie
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Pas na de deploy: nieuwe URL's melden bij IndexNow (Bing e.a.). ref: main, want de redactie-job heeft
      # net nieuwe content gepusht die niet in de commit zit die deze run startte.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: IndexNow
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          python -m engine.run indexnow
        env:
          TZ: Europe/Amsterdam
